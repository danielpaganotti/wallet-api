server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: wallet-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet_api}
    username: ${DB_USERNAME:wallet_api}
    password: ${DB_PASSWORD:wallet_api}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info

api:
  security:
    api-key: ${API_KEY:changeme-local-dev-key}

logging:
  level:
    org.hibernate.SQL: warn
